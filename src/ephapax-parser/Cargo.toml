[package]
name = "ephapax-parser"
description = "Parser for the Ephapax programming language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ephapax-syntax = { workspace = true }
ephapax-surface = { path = "../ephapax-surface" }
ariadne = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
pest = "2.7"
pest_derive = "2.7"

[dev-dependencies]
# The grammar conformance test reads ephapax.pest with the parser that
# pest_derive uses (already in the lock file, same version).
pest_meta = "2.7"
ephapax-desugar = { path = "../ephapax-desugar" }
ephapax-typing = { path = "../ephapax-typing" }
criterion = { workspace = true }

[[bench]]
name = "parse_bench"
harness = false
