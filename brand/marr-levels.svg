<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640"><defs><filter id="soft" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur in="SourceGraphic" result="b" stdDeviation="1.5"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#161b22"/><stop offset="100%" stop-color="#0d1117"/></radialGradient></defs><rect width="1280" height="640" fill="url(#bg)"/><text x="64" y="68" fill="#e6edf3" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="1">ephapax — at Marr&apos;s three levels</text><text x="64" y="100" fill="#8b949e" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="300">one system, read from intent down to substrate</text><line x1="34" x2="34" y1="150" y2="600" stroke="#e8a33d" stroke-width="2" opacity=".5"/><path fill="#e8a33d" d="M 34,600 l -7,-16 l 14,0 z" opacity=".6"/><text x="20" y="380" fill="#8b949e" font-family="system-ui,sans-serif" font-size="14" font-weight="300" text-anchor="middle" transform="rotate(-90 20 380)">abstract → concrete</text><g filter="url(#soft)"><rect width="1152" height="128" x="64" y="150" fill="#1b1407" stroke="#e8a33d" stroke-width="1.5" opacity=".95" rx="14"/></g><circle cx="118" cy="214" r="26" fill="none" stroke="#e8a33d" stroke-width="3"/><text x="118" y="222" fill="#e8a33d" font-family="system-ui,sans-serif" font-size="26" font-weight="300" text-anchor="middle">?</text><text x="172" y="196" fill="#e8a33d" font-family="system-ui,sans-serif" font-size="24" font-weight="400">Computational — what &amp; why</text><text x="172" y="230" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="19" font-weight="300">Guarantee resource safety — no leak, no use-after-free, exactly-once —</text><text x="172" y="256" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="19" font-weight="300">for the whole neurosymbolic stack. A dyadic linear/affine language.</text><g filter="url(#soft)"><rect width="1152" height="128" x="64" y="296" fill="#19130a" stroke="#c47e3a" stroke-width="1.5" opacity=".95" rx="14"/></g><circle cx="118" cy="360" r="26" fill="none" stroke="#c47e3a" stroke-width="3"/><path stroke="#c47e3a" stroke-width="3" d="M 104,360 h 28 M 118,346 v 28"/><text x="172" y="342" fill="#c47e3a" font-family="system-ui,sans-serif" font-size="24" font-weight="400">Algorithmic — representation &amp; process</text><text x="172" y="376" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="19" font-weight="300">Four layers: L1 region capabilities · L2 modality (linear/affine) ·</text><text x="172" y="402" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="19" font-weight="300">L3 echo residue · L4 dyadic mode. Preservation re-derived per layer.</text><g filter="url(#soft)"><rect width="1152" height="128" x="64" y="442" fill="#15110b" stroke="#8b949e" stroke-width="1.5" opacity=".95" rx="14"/></g><circle cx="118" cy="506" r="26" fill="none" stroke="#8b949e" stroke-width="3"/><rect width="24" height="24" x="106" y="494" fill="none" stroke="#8b949e" stroke-width="3" rx="4"/><text x="172" y="488" fill="#c9d1d9" font-family="system-ui,sans-serif" font-size="24" font-weight="400">Implementational — physical substrate</text><text x="172" y="522" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="19" font-weight="300">Rust crate ephapax-linear + dual machine proofs (Coq formal/*.v,</text><text x="172" y="548" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="19" font-weight="300">Idris2 src/abi). Compiles to typed-wasm — foundation of the chain.</text></svg>