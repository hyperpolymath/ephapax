[workspace]
resolver = "2"
members = [
    "src/ephapax-ir",
    "src/ephapax-syntax",
    "src/ephapax-typing",
    "src/ephapax-wasm",
    "src/ephapax-runtime",
    "src/ephapax-lexer",
    "src/ephapax-parser",
    "src/ephapax-interp",
    "src/ephapax-repl",
    "src/ephapax-cli",
    "src/ephapax-stdlib",
    "src/ephapax-lsp",
    "src/ephapax-package",
    "src/ephapax-analysis",
    "ephapax-linear",
    "src/ephapax-surface",
    "src/ephapax-desugar",
    "src/ephapax-driver",
    "src/ephapax-query",
    "src/ephapax-meta",
    "tests/fuzz",
    # "src/ephapax-vram-cache",  # Disabled: requires ephapax-proven repo
    # "src/ephapax-tools",  # Excluded (v2 plan E3): no consumer. Its formatter and
    #   linter are text heuristics that do not load programs, so they do not go
    #   through ephapax-driver. It builds as a member: 31 tests pass, 8 clippy warnings.
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <jonathan.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/ephapax"
keywords = ["linear-types", "memory-safety", "wasm", "compiler"]
categories = ["compilers", "wasm", "memory-management"]

[workspace.dependencies]
# Internal crates
ephapax-syntax = { path = "src/ephapax-syntax" }
ephapax-ir = { path = "src/ephapax-ir" }
ephapax-typing = { path = "src/ephapax-typing" }
ephapax-wasm = { path = "src/ephapax-wasm" }
ephapax-runtime = { path = "src/ephapax-runtime" }
ephapax-lexer = { path = "src/ephapax-lexer" }
ephapax-parser = { path = "src/ephapax-parser" }
ephapax-interp = { path = "src/ephapax-interp" }
ephapax-repl = { path = "src/ephapax-repl" }
ephapax-stdlib = { path = "src/ephapax-stdlib" }
ephapax-lsp = { path = "src/ephapax-lsp" }
ephapax-package = { path = "src/ephapax-package" }
ephapax-query = { path = "src/ephapax-query" }
ephapax-meta = { path = "src/ephapax-meta" }
ephapax-driver = { path = "src/ephapax-driver" }
ephapax-vram-cache = { path = "src/ephapax-vram-cache" }

# Sibling-repo crates.
# NOTE: rev pin is the merge commit of typed-wasm#203 (2026-07-07,
# per-module split + `tw link`, #140), checked 2026-11-09. It postdates
# typed-wasm#65, which renamed the custom section `affinescript.ownership`
# → `typedwasm.ownership`. Re-bump only when a newer `typed-wasm-verify`
# API change is needed, and update this comment with the new PR.
typed-wasm-verify = { git = "https://github.com/hyperpolymath/typed-wasm", rev = "5d67603852098561d5f4e967f6d0bdf3d3e10a16", features = ["unstable-l2"] }

# External dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
wasm-encoder = "0.221"
logos = "0.14"
chumsky = "1.0.0-alpha.7"
ariadne = "0.4"
clap = { version = "4", features = ["derive"] }
colored = "2"
rustyline = "14"

# Benchmarking dependencies
criterion = { version = "0.5", features = ["html_reports"] }
wasmtime = "36"

# Property-based testing
proptest = "1.4"
